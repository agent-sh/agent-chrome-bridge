<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Chrome Bridge</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="title">Agent Chrome Bridge</div>
      <div class="status" id="status">disconnected</div>
    </header>

    <nav class="controls">
      <label>Model
        <select id="model">
          <option value="sonnet" selected>Sonnet 4.6</option>
          <option value="opus">Opus 4.7</option>
          <option value="haiku">Haiku 4.5</option>
        </select>
      </label>
      <label>Mode
        <select id="mode">
          <option value="per-session" selected>Per-session</option>
          <option value="per-action">Per-action</option>
          <option value="trust">Trust</option>
        </select>
      </label>
      <button type="button" id="abort" class="danger" disabled>Abort</button>
    </nav>

    <main class="chat" id="chat" aria-live="polite"></main>

    <form class="composer" id="composer">
      <textarea id="input" rows="3" placeholder="Ask Claude to read, navigate, click…" required></textarea>
      <button type="submit" id="send">Send</button>
    </form>

    <script src="app.js"></script>
  </body>
</html>
